name: Lab images

on:
  push:
    branches: [master, "lab/**"]
    paths:
      - "pom.xml"
      - "ts-common/**"
      - "ts-basic-service/**"
      - "ts-order-other-service/**"
      - "ts-inside-payment-service/**"
      - "ts-payment-service/**"
      - "ts-cancel-service/**"
      - "ts-voucher-service/**"
      - "traffic-driver/**"
      - ".github/workflows/lab-images.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/rajagopal-epistak

jobs:
  service:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - ts-basic-service
          - ts-order-other-service
          - ts-inside-payment-service
          - ts-payment-service
          - ts-cancel-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - name: Package ${{ matrix.module }}
        run: mvn -B -pl ${{ matrix.module }} -am package -Dmaven.test.skip=true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.module }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.module }}:lab
            ${{ env.REGISTRY }}/${{ matrix.module }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: traffic-driver
            image: tt-traffic-driver
          - context: ts-voucher-service
            image: ts-voucher-service
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:lab
            ${{ env.REGISTRY }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
